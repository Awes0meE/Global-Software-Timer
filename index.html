<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>全局软件计时器</title>
    <!-- Fetch the e-ink screen pixel font in parallel with the JS bundle so the swap from the fallback face happens before first paint. Vite rewrites this href to the emitted hashed asset; keep it in sync with the GST Pixel @font-face in src/styles.css. -->
    <link
      rel="preload"
      href="/src/assets/fonts/ark-pixel-12px-zh_hans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- The interface fonts (GST Inter, GST Noto Sans SC in src/styles.css), preloaded for the same reason. -->
    <link
      rel="preload"
      href="/src/assets/fonts/poster/InterVariable-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/poster/NotoSansSC-VF-gb2312.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- The number font (GST Num in src/styles.css). -->
    <link
      rel="preload"
      href="/src/assets/fonts/oxanium/Oxanium-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <!--
      THESIS: GST is a glass desk instrument, not a web dashboard; it refuses the stat-card grid.
      OWN-WORLD: a Mica-like glass shell (light or dark) floating over a soft glow, matte e-ink screens set in
        Ark Pixel that print without glowing, flat glass keys, indicator lamps; signal orange only for what is
        happening now, the accent colour for selection and focus; mix colours identify software.
      STORY: open from the tray, read today on the e-ink screen in seconds, compare software in the aligned ledger, close.
      FIRST VIEWPORT: full-width e-ink screen on top (24-hour segmented dial, 今日记录, 今日活跃, 最常用 in pixel type);
        ledger table in the main column; distribution plate and foreground lamps in the right rail.
      FORM: desk precision instrument fused with a chronograph dial, grounded list position 3, seed 67a77ee3.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
