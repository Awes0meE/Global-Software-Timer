name: ✨ 功能建议
description: 想要一个新功能，或者希望某个地方做得更好。
title: "[建议]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 你遇到了什么不方便，或者想知道什么？
      placeholder: 我想知道……
    validations:
      required: true
  - type: dropdown
    id: scenario
    attributes:
      label: 你主要用电脑做什么
      description: 可以多选，帮我们了解不同场景下的需求。
      multiple: true
      options:
        - 学习、写论文
        - 写代码
        - 设计、剪辑
        - 办公
        - 游戏
        - 其他
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎么做
      description: 你希望全局软件计时器怎样帮你？有参考的软件也可以写上。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及哪一部分
      options:
        - 概览
        - 软件
        - 后台
        - 统计
        - 成就
        - 设置
        - 托盘与开机自启
        - 记录准确性
        - 导出、备份与海报
        - 文档
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私影响
      description: 全局软件计时器只记软件，不记内容，也不联网。
      options:
        - label: 这个功能不需要收集窗口标题、文档名、网页标题、按键、鼠标位置、文件内容、浏览记录，也不需要联网。
          required: false
        - label: 这个功能可能会碰到隐私边界，需要先仔细讨论。
          required: false
