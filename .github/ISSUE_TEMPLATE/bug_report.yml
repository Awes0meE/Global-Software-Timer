name: 🐞 报告问题
description: 哪里坏了、数字不对、或者表现不稳定。
title: "[问题]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢你帮忙改进全局软件计时器！提交前请去掉截图和描述里的私人信息，例如文件名、文档名、网页标题和个人路径。
  - type: textarea
    id: summary
    attributes:
      label: 发生了什么
      description: 你看到了什么问题？
      placeholder: 概览页的今日活跃显示……
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 怎么复现
      description: 按什么步骤操作会出现这个问题？
      placeholder: |
        1. 打开软件
        2. 切到……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 你期望的结果
      description: 你原本以为会怎样？
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: GST 版本
      description: 侧栏底部或安装包文件名里能看到。
      placeholder: 例如 0.4.3
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows 版本
      options:
        - Windows 11
        - Windows 10
        - 其他
    validations:
      required: true
  - type: dropdown
    id: installer
    attributes:
      label: 安装方式
      options:
        - EXE 安装包
        - MSI 安装包
        - 自己编译的开发版
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 其他环境信息
      description: 选填。多显示器、笔记本合盖睡眠、杀毒软件、相关软件的名字等，可能和问题有关的都可以写。
  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 选填。可以直接把图片拖进来。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我已尽量去掉文件名、文档名、网页标题、个人路径等私人信息。
          required: true
