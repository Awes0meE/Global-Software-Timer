name: Windows release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-validation.yml
      - package-lock.json
      - 'docs/releases/*.md'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.evidence.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Validate and build installers
        run: npm run release:build
      - name: Prepare release evidence
        id: evidence
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version" }
          $names = @("Global.Software.Timer_${version}_x64-setup.exe", "Global.Software.Timer_${version}_x64_en-US.msi")
          $assets = @(Get-ChildItem release-staging -File)
          if (Compare-Object $names @($assets.Name)) { throw "Unexpected installer set" }
          $hashes = foreach ($name in $names) {
            $hash = (Get-FileHash "release-staging/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $hashes | Set-Content release-staging/SHA256SUMS.txt -Encoding utf8NoBOM
          Copy-Item "docs/releases/v$version.md" release-staging/RELEASE_NOTES.md
          @("", "Source commit $env:GITHUB_SHA", "", "## SHA-256", "", '~~~text') + $hashes + @('~~~') |
            Add-Content release-staging/RELEASE_NOTES.md -Encoding utf8
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: gst-${{ steps.evidence.outputs.version }}-windows
          path: release-staging/
          if-no-files-found: error
  publish:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, format('chore(release): publish {0}', needs.build.outputs.version))
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gst-${{ needs.build.outputs.version }}-windows
          path: release-staging
      - name: Publish verified installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MERGE_MESSAGE: ${{ github.event.head_commit.message }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $subject = ($env:MERGE_MESSAGE -split '\r?\n', 2)[0]
          if ($subject -cne "chore(release): publish $version") { throw "Release title and version differ" }
          $files = @("Global.Software.Timer_${version}_x64-setup.exe", "Global.Software.Timer_${version}_x64_en-US.msi")
          $sums = @(Get-Content release-staging/SHA256SUMS.txt)
          if ($sums.Count -ne $files.Count) { throw "Unexpected checksum manifest" }
          $upload = foreach ($file in $files) {
            $path = "release-staging/$file"
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($sums -cnotcontains "$hash  $file") { throw "Checksum mismatch for $file" }
            $path
          }
          $upload += 'release-staging/SHA256SUMS.txt'
          gh release create "v$version" @upload --target $env:GITHUB_SHA --title "Global Software Timer v$version" --notes-file release-staging/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
