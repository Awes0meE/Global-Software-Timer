name: Windows release
on:
  push:
    branches: [main, build/release-014]
    paths:
      - .github/workflows/release-validation.yml
      - package-lock.json
      - docs/releases/v0.1.4.md
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Validate and build installers
        run: npm run release:build
      - name: Prepare release evidence
        shell: pwsh
        run: |
          $assets = Get-ChildItem release-staging -File | Where-Object { $_.Extension -in '.exe', '.msi' }
          if ($assets.Count -ne 2) { throw "Expected two installers" }
          $assets | ForEach-Object { "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() )  $($_.Name)" } | Set-Content -Encoding utf8 release-staging/SHA256SUMS.txt
          Copy-Item docs/releases/v0.1.4.md release-staging/RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: gst-0.1.4-windows
          path: release-staging/
          if-no-files-found: error
  publish:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release): publish 0.1.4')
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: gst-0.1.4-windows
          path: release-staging
      - name: Publish verified installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($version -ne '0.1.4') { throw "Unexpected version" }
          $assets = @(Get-ChildItem release-staging -File | Where-Object { $_.Extension -in '.exe', '.msi' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object FullName)
          gh release create v0.1.4 @assets --target $env:GITHUB_SHA --title 'Global Software Timer v0.1.4' --notes-file release-staging/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
      - name: Remove completed remote branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $repair = gh api "repos/$env:GH_REPO/git/ref/heads/fix/tracker-reliability" --jq '.object.sha' 2>$null
          if ($LASTEXITCODE -eq 0 -and $repair -eq '8414ac4c5bec83d18170d86f59279ef817c05e4c') {
            gh api --method DELETE "repos/$env:GH_REPO/git/refs/heads/fix/tracker-reliability"
            if ($LASTEXITCODE -ne 0) { throw "Repair branch cleanup failed" }
          }
          git diff --quiet origin/build/release-014 HEAD
          if ($LASTEXITCODE -ne 0) { throw "Release branch differs from the published tree" }
          gh api --method DELETE "repos/$env:GH_REPO/git/refs/heads/build/release-014"
          if ($LASTEXITCODE -ne 0) { throw "Release branch cleanup failed" }
