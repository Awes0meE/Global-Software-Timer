# Counts release downloads and publishes them as a shields.io endpoint JSON on
# the `badges` branch. The README badge reads that file, because the live
# shields downloads badge is too slow for GitHub's image proxy and often fails.
name: Badges

on:
  schedule:
    - cron: "17 2 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badges
  cancel-in-progress: false

jobs:
  downloads:
    runs-on: ubuntu-latest
    steps:
      - name: Count release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].assets[].download_count' | awk '{ s += $1 } END { print s + 0 }')
          echo "Total downloads: ${total}"
          mkdir -p out
          printf '{"schemaVersion":1,"label":"下载量","message":"%s","color":"2ea043"}\n' "${total}" > out/downloads.json

      - name: Publish to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: out
        run: |
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.json
          git commit -q -m "chore(badges): update downloads count"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
